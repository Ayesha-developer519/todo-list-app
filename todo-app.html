<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List App</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    color: #1e293b;
  }

  .app {
    width: 100%;
    max-width: 540px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 25px 60px rgba(30, 20, 80, 0.35);
    padding: 32px 28px;
    align-self: flex-start;
  }

  h1 {
    margin: 0;
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #4f46e5, #db2777);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .count {
    margin: 6px 0 14px;
    color: #64748b;
    font-size: 0.92rem;
  }

  .progress {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4f46e5, #db2777);
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .add-row {
    display: flex;
    gap: 10px;
  }

  .add-row input {
    flex: 1;
    padding: 13px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1rem;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .add-row input:focus {
    border-color: #6366f1;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 9px 15px;
    font-size: 0.88rem;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
  }

  button:hover {
    transform: translateY(-1px);
  }

  .add-btn {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #ffffff;
    padding: 0 24px;
    font-size: 1rem;
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
  }

  .filters {
    display: flex;
    gap: 8px;
    margin: 22px 0 10px;
    background: #f1f5f9;
    padding: 5px;
    border-radius: 12px;
  }

  .filters button {
    flex: 1;
    background: transparent;
    color: #64748b;
  }

  .filters button:hover {
    transform: none;
    color: #1e293b;
  }

  .filters button.active {
    background: #ffffff;
    color: #4f46e5;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    margin-top: 10px;
    background: #f8fafc;
    border: 1px solid #eef2f7;
    border-left: 4px solid #6366f1;
    border-radius: 12px;
    animation: slideIn 0.3s ease;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  li:hover {
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.12);
    transform: translateX(3px);
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: #4f46e5;
    cursor: pointer;
  }

  li .text {
    flex: 1;
    word-break: break-word;
    font-size: 1rem;
  }

  li.done {
    border-left-color: #22c55e;
    background: #f0fdf4;
  }

  li.done .text {
    text-decoration: line-through;
    color: #94a3b8;
  }

  li input.edit {
    flex: 1;
    padding: 8px 10px;
    border: 2px solid #6366f1;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
  }

  .edit-btn {
    background: #e0e7ff;
    color: #4338ca;
  }

  .edit-btn:hover {
    background: #c7d2fe;
  }

  .del-btn {
    background: #ffe4e6;
    color: #be123c;
  }

  .del-btn:hover {
    background: #fecdd3;
  }

  li.empty {
    justify-content: center;
    color: #94a3b8;
    border-left-color: #cbd5e1;
    padding: 26px 0;
  }

  li.empty:hover {
    transform: none;
    box-shadow: none;
  }

  .clear {
    margin-top: 18px;
    background: transparent;
    color: #e11d48;
    padding: 6px 0;
  }

  .clear:hover {
    text-decoration: underline;
    transform: none;
  }
</style>
</head>
<body>
<div class="app">
  <h1>To-Do List</h1>
  <p class="count" id="count"></p>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="add-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="150">
    <button class="add-btn" id="addBtn">Add</button>
  </div>

  <div class="filters" id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
  </div>

  <ul id="taskList"></ul>
  <button class="clear" id="clearDone">Clear completed</button>
</div>

<script>
  const STORAGE_KEY = "todo-tasks";

  const input = document.getElementById("taskInput");
  const addBtn = document.getElementById("addBtn");
  const list = document.getElementById("taskList");
  const countEl = document.getElementById("count");

  // Sample data: pehli dafa app khulne par ye tasks nazar aayenge
  const sampleTasks = [
    { id: 1, text: "Complete the portfolio website", completed: true },
    { id: 2, text: "Push project code to GitHub", completed: true },
    { id: 3, text: "Build the To-Do List App", completed: false },
    { id: 4, text: "Practice JavaScript DOM manipulation", completed: false },
    { id: 5, text: "Revise Laravel routes and controllers", completed: false },
    { id: 6, text: "Prepare for the next internship task", completed: false }
  ];

  // task-state: array of { id, text, completed }
  let tasks = loadTasks();
  let filter = "all";
  let editingId = null;

  // ---------- localStorage (persist & retrieve) ----------
  function loadTasks() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY); // string or null

      if (saved) {
        return JSON.parse(saved); // string -> array
      }

      // localStorage khali hai (pehli visit) to sample tasks dikhao
      return sampleTasks;
    } catch (error) {
      return sampleTasks;
    }
  }

  function saveTasks() {
    try {
      // array -> string
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (error) {
      console.error("Could not save tasks", error);
    }
  }

  // ---------- CRUD ----------
  function addTask() {
    const text = input.value.trim();

    if (!text) {
      input.focus();
      return;
    }

    // Create
    tasks.push({
      id: Date.now(),
      text: text,
      completed: false
    });

    input.value = "";
    update();
  }

  // Update (complete)
  function toggleTask(id) {
    const task = tasks.find(function (t) {
      return t.id === id;
    });

    if (task) {
      task.completed = !task.completed;
    }

    update();
  }

  // Update (edit)
  function saveEdit(id, newText) {
    newText = newText.trim();

    const task = tasks.find(function (t) {
      return t.id === id;
    });

    if (task && newText) {
      task.text = newText;
    }

    editingId = null;
    update();
  }

  // Delete
  function deleteTask(id) {
    tasks = tasks.filter(function (t) {
      return t.id !== id;
    });

    update();
  }

  // ---------- Filter helper ----------
  function getVisibleTasks() {
    return tasks.filter(function (t) {
      if (filter === "completed") {
        return t.completed;
      }

      if (filter === "active") {
        return !t.completed;
      }

      return true;
    });
  }

  // ---------- Render (DOM manipulation) ----------
  function render() {
    // purani list saaf karo
    list.textContent = "";

    const visible = getVisibleTasks();

    if (visible.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No tasks here yet.";
      list.appendChild(empty);
    }

    visible.forEach(function (task) {
      const li = document.createElement("li");
      li.dataset.id = task.id;

      if (task.completed) {
        li.classList.add("done");
      }

      // checkbox
      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = task.completed;
      check.dataset.action = "toggle";
      li.appendChild(check);

      if (editingId === task.id) {
        // edit mode
        const edit = document.createElement("input");
        edit.type = "text";
        edit.className = "edit";
        edit.value = task.text;
        edit.dataset.action = "edit-input";
        li.appendChild(edit);

        const save = document.createElement("button");
        save.textContent = "Save";
        save.className = "edit-btn";
        save.dataset.action = "save";
        li.appendChild(save);

        setTimeout(function () {
          edit.focus();
        }, 0);
      } else {
        // normal mode (textContent = HTML injection se safe)
        const span = document.createElement("span");
        span.className = "text";
        span.textContent = task.text;
        li.appendChild(span);

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.className = "edit-btn";
        editBtn.dataset.action = "edit";
        li.appendChild(editBtn);
      }

      // delete button
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "del-btn";
      del.dataset.action = "delete";
      li.appendChild(del);

      list.appendChild(li);
    });

    // remaining tasks counter
    const left = tasks.filter(function (t) {
      return !t.completed;
    }).length;

    if (tasks.length === 0) {
      countEl.textContent = "Nothing to do. Add your first task!";
    } else if (tasks.length === 1) {
      countEl.textContent = left + " of 1 task remaining";
    } else {
      countEl.textContent = left + " of " + tasks.length + " tasks remaining";
    }
  }

  function updateProgress() {
    const bar = document.getElementById("progressBar");
    let percent = 0;

    if (tasks.length > 0) {
      const done = tasks.filter(function (t) {
        return t.completed;
      }).length;

      percent = Math.round((done / tasks.length) * 100);
    }

    bar.style.width = percent + "%";
  }

  function update() {
    saveTasks();
    render();
    updateProgress();
  }

  // ---------- Event handling ----------
  addBtn.addEventListener("click", addTask);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      addTask();
    }
  });

  // Event delegation: ek hi listener poori list ke liye
  list.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-id]");
    const action = e.target.dataset.action;

    if (!li || !action) {
      return;
    }

    const id = Number(li.dataset.id);

    if (action === "delete") {
      deleteTask(id);
    } else if (action === "edit") {
      editingId = id;
      render();
    } else if (action === "save") {
      saveEdit(id, li.querySelector(".edit").value);
    }
  });

  list.addEventListener("change", function (e) {
    if (e.target.dataset.action === "toggle") {
      const id = Number(e.target.closest("li").dataset.id);
      toggleTask(id);
    }
  });

  list.addEventListener("keydown", function (e) {
    if (e.target.dataset.action !== "edit-input") {
      return;
    }

    const id = Number(e.target.closest("li").dataset.id);

    if (e.key === "Enter") {
      saveEdit(id, e.target.value);
    }

    if (e.key === "Escape") {
      editingId = null;
      render();
    }
  });

  document.getElementById("filters").addEventListener("click", function (e) {
    if (!e.target.dataset.filter) {
      return;
    }

    filter = e.target.dataset.filter;

    document.querySelectorAll("#filters button").forEach(function (btn) {
      btn.classList.toggle("active", btn === e.target);
    });

    render();
  });

  document.getElementById("clearDone").addEventListener("click", function () {
    tasks = tasks.filter(function (t) {
      return !t.completed;
    });

    update();
  });

  // page load par saved tasks dikhao
  render();
  updateProgress();
</script>
</body>
</html>
